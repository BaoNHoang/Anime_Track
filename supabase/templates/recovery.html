<h2>Reset your Banime password</h2>
<p>Enter this code in Banime to choose a new password:</p>
<p style="font-size: 28px; font-weight: 700; letter-spacing: 4px;">
  {{ .Token }}
</p>
<p>If you did not request this reset, you can ignore this email.</p>
<table role="presentation" style="margin-top: 24px; border-top: 1px solid #d9d9df; padding-top: 16px;">
  <tr>
    <td style="padding-right: 10px;">
      <img src="{{ .SiteURL }}/icon.svg" width="32" height="32" alt="Banime" style="display: block;" />
    </td>
    <td style="font-family: Arial, sans-serif; color: #171822;">
      <strong>Banime</strong><br />
      <span style="font-size: 12px; color: #646775;">Anime tracker</span>
    </td>
  </tr>
</table>
